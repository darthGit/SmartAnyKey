name: Feature request
description: Suggest something the help desk needs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it — a screen, a setting, a workflow.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
